name: Build and Push Docker Image

on:
  push:
    # master is this repo's default branch; main is kept for renames/forks
    branches: [master, main]
    tags: ['v*']
  # Catch a broken image before it is merged
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Target platforms, comma separated (linux/amd64,linux/arm64)'
        required: true
        default: linux/amd64
      push:
        description: 'Push the image to ghcr.io'
        type: boolean
        default: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/bookarr

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # QEMU + buildx: needed for cross-building (set platforms to linux/amd64,linux/arm64)
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' || inputs.push == true }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BOOKARR_VERSION=${{ github.ref_name }}

